<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="闪裳Live">
  <title>闪裳Live</title>
  <!-- B 图标：深紫圆章 + 渐变"闪电挂钩衣架"。自带底色，深浅背景通用 -->
  <defs>
    <linearGradient id="bi-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="90">
      <stop offset="0" stop-color="#ff4fd8" />
      <stop offset="1" stop-color="#6c8cff" />
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="16" fill="#2a1450" />
  <!-- 细描边：避免深色背景上圆章与背景糊在一起 -->
  <circle cx="16" cy="16" r="15.25" fill="none" stroke="#9a6cff" stroke-width="1.5" stroke-opacity="0.7" />
  <g transform="translate(4 4.5) scale(0.24)">
    <path d="M60 2 L40 28 H54 L50 50 L70 20 H56 L66 2 Z" fill="url(#bi-grad)" />
    <path d="M50 50 L8 82 Q2 88 12 88 H88 Q98 88 92 82 Z" fill="none" stroke="url(#bi-grad)" stroke-width="10" stroke-linejoin="round" />
  </g>
</svg>
