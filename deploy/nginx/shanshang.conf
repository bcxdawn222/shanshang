# 闪裳Live · nginx location 片段（开发测试期挂在 /sl/）
#
# 用法：把下面的 location 整段粘进【现有站点的 server { ... } 块】里（listen 443 的那个；
# 还没上 HTTPS 就先放 listen 80 的那个），然后：
#   nginx -t && systemctl reload nginx
#
# 注意：
# - 同一个 server 块里已有其它系统挂在 /mc/，不要改动、删除、覆盖任何 /mc/ 相关配置。
#   这里全部用 `^~` 前缀匹配，只接管 /sl/ 下的请求，也不会被已有的正则 location 抢走。
# - 不要新增或改 server 块本身（listen、server_name、证书等）。
# - 静态目录 /opt/shanshang/current 是 deploy.sh 维护的软链，指向当前版本。
# - 127.0.0.1:8300 与 /etc/shanshang/server.env 的 PORT 一致。
# - add_header 写在 location 里会让 server 块的 add_header 在这些 location 里失效，
#   所以安全头在每个 location 里显式写全。

# ---------- 接口：/sl/api/... → 服务端 /api/... ----------
location ^~ /sl/api/ {
    proxy_pass http://127.0.0.1:8300/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆盖而不是追加：服务端 TRUST_PROXY=1 时信任这个头，追加会让客户端伪造 IP 绕过登录限流。
    # 若前面还有 CDN / 负载均衡，改成取其真实 IP 的写法（real_ip 模块）
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 广告视频 ≤200MB（multipart 会略大），上传直接流给服务端，不在 nginx 落盘
    client_max_body_size 210m;
    proxy_request_buffering off;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # 视频 Range：透传 Range / If-Range，响应不缓冲，206 和 Content-Range 原样返回
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_max_temp_file_size 0;

    # 只压 JSON 等文本；视频、图片本身已压缩，且不能对 206 做 gzip
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/plain;

    # 缓存策略由服务端决定（媒体文件 immutable，接口不缓存）
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ---------- 快照公开页：/sl/s/<token> → 服务端 /s/<token> ----------
location ^~ /sl/s/ {
    proxy_pass http://127.0.0.1:8300/s/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 链接里带随机令牌，不外泄 Referer
    add_header Referrer-Policy "no-referrer" always;
    # 含顾客人像，禁止收录
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# ---------- 后台（总后台 + 分后台，hash 路由，只有一个 index.html） ----------
location = /sl/admin {
    return 301 /sl/admin/;
}

location ^~ /sl/admin/ {
    alias /opt/shanshang/current/admin/;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # index.html 不缓存，发版后立即生效
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Vite 产物文件名带内容哈希，长期缓存
    location ^~ /sl/admin/assets/ {
        alias /opt/shanshang/current/admin/assets/;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript image/svg+xml application/json;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

# ---------- 设备前台（广告机） ----------
location = /sl/device {
    return 301 /sl/device/;
}

location ^~ /sl/device/ {
    alias /opt/shanshang/current/device/;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # 不加 X-Frame-Options：广告机外壳嵌入方式未确认，避免把设备前台挡掉

    location ^~ /sl/device/assets/ {
        alias /opt/shanshang/current/device/assets/;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript image/svg+xml application/json;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

# HSTS 作用于整个域名（包括 /mc/），确认全站都能走 HTTPS 后，由站点负责人在 server 块里统一加：
#   add_header Strict-Transport-Security "max-age=31536000" always;
